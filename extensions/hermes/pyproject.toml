[project]
name = "denied-hermes-plugin"
version = "0.5.3"
description = "Denied authorization plugin for Hermes Agent"
authors = [{ name = "Denied Technologies", email = "support@denied.dev" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "denied-sdk>=0.5.2",
]

[tool.uv.sources]
denied-sdk = { workspace = true }

# Hermes' loader does ``getattr(ep.load(), "register")`` and expects ``ep.load()``
# to return the *module*. A ``module:attr`` value makes it return the attribute,
# so the loader finds no ``register`` and silently skips the plugin. Point at the
# module only. Guarded by tests/test_entry_point.py.
[project.entry-points."hermes_agent.plugins"]
denied = "denied_hermes.plugin"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denied_hermes"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "PT", "Q", "PTH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
